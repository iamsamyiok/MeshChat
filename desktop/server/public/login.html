<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录笔记本</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1ea; font-family: ui-sans-serif, system-ui, sans-serif; color: #1f1b16; }
    form { width: min(360px, 92vw); background: #fffdf8; border: 1px solid #e4ddd2; border-radius: 14px; padding: 28px; }
    h1 { margin: 0 0 8px; font: 22px/1.3 "Iowan Old Style", Palatino, serif; }
    p { margin: 0 0 18px; color: #7a7368; font-size: 13px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #e4ddd2; border-radius: 8px; font-size: 15px; }
    button { margin-top: 12px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #2f6f5e; color: #fff; cursor: pointer; }
    .err { color: #b91c1c; min-height: 1.2em; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <form id="f">
    <h1>笔记本</h1>
    <p>输入共享密码后，同一 Tailscale 网址可继续写。</p>
    <input id="pw" type="password" placeholder="密码" autofocus>
    <button type="submit">进入</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) { err.textContent = data.error || '登录失败'; return; }
      location.href = '/';
    };
  </script>
</body>
</html>
