name: build-apk
on: [push, workflow_dispatch]
permissions: { contents: write }
concurrency:
  group: build-clients
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.4" }
      - run: gradle assembleDebug --no-daemon
      - name: commit apk to repo
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/MeshChat.apk
          git config user.name "iamsamyiok"
          git config user.email "iamsamyiok@users.noreply.github.com"
          git add apk/MeshChat.apk
          git diff --cached --quiet || (git commit -m "build: MeshChat.apk" && git pull --rebase origin master && git push)
  exe:
    runs-on: windows-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: build portable exe
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win portable --x64 --publish never
      - name: commit exe to repo
        shell: bash
        run: |
          mkdir -p exe
          cp desktop/dist/MeshChat*.exe exe/MeshChat.exe
          git config user.name "iamsamyiok"
          git config user.email "iamsamyiok@users.noreply.github.com"
          git add exe/MeshChat.exe
          git diff --cached --quiet || (git commit -m "build: MeshChat.exe" && git pull --rebase origin master && git push)
