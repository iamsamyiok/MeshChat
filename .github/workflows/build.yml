name: build
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
permissions: { contents: write }
concurrency:
  group: build-clients
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.4" }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: MeshChat-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: attach to release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
  exe:
    runs-on: windows-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: build portable exe
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: MeshChat-exe, path: desktop/dist/*.exe }
      - name: attach to release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/MeshChat*.exe
          make_latest: true
