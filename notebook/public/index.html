<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>笔记本</title>
  <style>
    :root {
      --bg: #f3efe6;
      --paper: #fffdf8;
      --ink: #1f1b16;
      --muted: #7a7368;
      --line: #d9d0c3;
      --accent: #2f6f5e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif SC", serif;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 820px;
      margin: 0 auto;
      background: var(--paper);
      box-shadow: 0 0 0 1px var(--line);
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .bar b { font-weight: 600; letter-spacing: 0.04em; }
    .bar .spacer { flex: 1; }
    .status { font-size: 12px; color: var(--muted); }
    .status.saving { color: #b45309; }
    .status.saved { color: var(--accent); }
    .status.err { color: #b91c1c; }
    button {
      font: 13px/1 ui-sans-serif, system-ui, sans-serif;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    #editor {
      flex: 1;
      overflow: auto;
      padding: 28px 32px 64px;
      outline: none;
      font-size: 18px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #editor:empty:before {
      content: attr(data-placeholder);
      color: #b3aa9d;
    }
    hr.cut {
      border: 0;
      height: 0;
      margin: 22px 0;
      border-top: 1px solid #cfc6b8;
      position: relative;
    }
    hr.cut:after {
      content: "";
      position: absolute;
      left: 50%;
      top: -4px;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      background: var(--paper);
      border: 1px solid #cfc6b8;
      border-radius: 50%;
    }
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(31, 27, 22, 0.28);
      z-index: 20;
      place-items: center;
    }
    #overlay.show { display: grid; }
    #overlay form {
      width: min(380px, 92vw);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    #overlay h2 { margin: 0 0 8px; font: 20px/1.3 "Iowan Old Style", Palatino, serif; }
    #overlay p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
    #overlay label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    #overlay input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 15px;
    }
    #overlay .row { display: grid; grid-template-columns: 1fr 92px; gap: 8px; }
    #overlay .actions { display: flex; gap: 8px; margin-top: 16px; }
    #overlay .actions button { flex: 1; }
    #ovErr { color: #b91c1c; min-height: 1.2em; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <b>笔记本</b>
      <button class="primary" id="cutBtn" type="button">分隔</button>
      <div class="spacer"></div>
      <button id="serverBtn" type="button">服务器</button>
      <div class="status" id="status">就绪</div>
    </div>
    <div id="editor" contenteditable="true" spellcheck="false" data-placeholder="开始写……"></div>
  </div>
  <div id="overlay">
    <form id="connForm">
      <h2>连接笔记本</h2>
      <p>填 Tailscale MagicDNS 或 100.x 地址和端口，下次自动连。</p>
      <div class="row">
        <div>
          <label for="hostIn">网址</label>
          <input id="hostIn" autocomplete="off" placeholder="machine.tail-xxxxx.ts.net">
        </div>
        <div>
          <label for="portIn">端口</label>
          <input id="portIn" inputmode="numeric" placeholder="8765">
        </div>
      </div>
      <label for="passIn">密码（可选）</label>
      <input id="passIn" type="password" placeholder="未设可留空">
      <div id="ovErr"></div>
      <div class="actions">
        <button class="primary" type="submit">连接</button>
        <button id="ovCancel" type="button">取消</button>
      </div>
    </form>
  </div>
  <script>
    const MARK = '\n---\n';
    const DEFAULT_PORT = '8765';
    const editor = document.getElementById('editor');
    const statusEl = document.getElementById('status');
    const overlay = document.getElementById('overlay');
    const ovErr = document.getElementById('ovErr');
    let timer = null;
    let dirty = false;
    let seq = 0;
    let apiBase = '';
    let token = localStorage.getItem('np_token') || '';
    let connected = false;

    function setStatus(text, cls) {
      statusEl.className = 'status' + (cls ? ' ' + cls : '');
      statusEl.textContent = text;
    }

    function savedHost() { return localStorage.getItem('np_host') || ''; }
    function savedPort() { return localStorage.getItem('np_port') || DEFAULT_PORT; }
    function savedPass() { return localStorage.getItem('np_pass') || ''; }

    function originOf(host, port) {
      let h = String(host || '').trim();
      if (!h) return '';
      if (!/^https?:\/\//i.test(h)) h = 'http://' + h;
      const u = new URL(h);
      u.port = String(port || u.port || DEFAULT_PORT);
      u.pathname = '/';
      u.search = '';
      u.hash = '';
      return u.origin;
    }

    function showOverlay() {
      document.getElementById('hostIn').value = savedHost();
      document.getElementById('portIn').value = savedPort();
      document.getElementById('passIn').value = savedPass();
      ovErr.textContent = '';
      overlay.classList.add('show');
    }

    function hideOverlay() { overlay.classList.remove('show'); }

    function htmlToText(root) {
      let out = '';
      function walk(node) {
        if (node.nodeType === 3) { out += node.nodeValue; return; }
        if (node.nodeName === 'BR') { out += '\n'; return; }
        if (node.nodeName === 'HR') { out += MARK; return; }
        if (node.nodeName === 'DIV' || node.nodeName === 'P') {
          if (out && !out.endsWith('\n') && !out.endsWith(MARK)) out += '\n';
        }
        for (const c of node.childNodes) walk(c);
        if (node.nodeName === 'DIV' || node.nodeName === 'P') {
          if (!out.endsWith('\n') && !out.endsWith(MARK)) out += '\n';
        }
      }
      walk(root);
      return out.replace(/\n+$/, '');
    }

    function textToHtml(text) {
      const parts = String(text || '').split(/\n---\n/);
      const frag = document.createDocumentFragment();
      parts.forEach((part, i) => {
        const lines = part.split('\n');
        lines.forEach((line, j) => {
          if (j) frag.appendChild(document.createElement('br'));
          if (line) frag.appendChild(document.createTextNode(line));
        });
        if (i < parts.length - 1) {
          const hr = document.createElement('hr');
          hr.className = 'cut';
          frag.appendChild(hr);
        }
      });
      return frag;
    }

    function insertDivider() {
      editor.focus();
      const sel = window.getSelection();
      if (!sel.rangeCount) {
        editor.appendChild(makeHr());
        afterInsert();
        return;
      }
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const hr = makeHr();
      range.insertNode(hr);
      const after = document.createTextNode('\n');
      hr.parentNode.insertBefore(after, hr.nextSibling);
      const next = document.createRange();
      next.setStartAfter(after);
      next.collapse(true);
      sel.removeAllRanges();
      sel.addRange(next);
      afterInsert();
    }

    function makeHr() {
      const hr = document.createElement('hr');
      hr.className = 'cut';
      return hr;
    }

    function afterInsert() {
      dirty = true;
      setStatus('未保存', 'saving');
      scheduleSave();
    }

    async function api(path, opt) {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers.Authorization = 'Bearer ' + token;
      const res = await fetch((apiBase || '') + path, Object.assign({ headers: headers }, opt || {}));
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        if (savedPass()) {
          const ok = await loginWith(savedPass());
          if (ok) return api(path, opt);
        }
        connected = false;
        showOverlay();
        throw new Error(data.error || '未登录');
      }
      if (!res.ok || data.ok === false) throw new Error(data.error || '请求失败');
      return data;
    }

    async function loginWith(password) {
      const res = await fetch((apiBase || '') + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password || '' })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) return false;
      token = data.token || '';
      if (token) localStorage.setItem('np_token', token);
      else localStorage.removeItem('np_token');
      return true;
    }

    async function probeSameOrigin() {
      if (!location.protocol.startsWith('http')) return false;
      try {
        const res = await fetch('/api/health', { headers: { 'Content-Type': 'application/json' } });
        const data = await res.json();
        return !!(res.ok && data && data.ok);
      } catch {
        return false;
      }
    }

    async function connectTo(host, port, password) {
      const origin = originOf(host, port);
      if (!origin) throw new Error('请填写网址');
      apiBase = origin;
      token = localStorage.getItem('np_token') || '';
      const health = await fetch(origin + '/api/health', { headers: { 'Content-Type': 'application/json' } });
      const info = await health.json().catch(() => ({}));
      if (!health.ok || !info.ok) throw new Error('连不上服务器');
      if (info.auth) {
        const pw = password || savedPass();
        if (!pw) throw new Error('需要密码');
        const ok = await loginWith(pw);
        if (!ok) throw new Error('密码错误');
        localStorage.setItem('np_pass', pw);
      } else {
        token = '';
        localStorage.removeItem('np_token');
        localStorage.removeItem('np_pass');
      }
      localStorage.setItem('np_host', host.trim());
      localStorage.setItem('np_port', String(port || DEFAULT_PORT));
      connected = true;
    }

    async function loadNote() {
      const data = await api('/api/note');
      editor.innerHTML = '';
      editor.appendChild(textToHtml(data.body || ''));
      setStatus('已同步', 'saved');
    }

    async function saveNow() {
      if (!connected) return;
      const my = ++seq;
      setStatus('保存中…', 'saving');
      try {
        const data = await api('/api/note', {
          method: 'PUT',
          body: JSON.stringify({ body: htmlToText(editor) })
        });
        if (my !== seq) return;
        dirty = false;
        const t = data.updatedAt ? new Date(data.updatedAt) : new Date();
        const hh = String(t.getHours()).padStart(2, '0');
        const mm = String(t.getMinutes()).padStart(2, '0');
        setStatus('已保存 ' + hh + ':' + mm, 'saved');
      } catch (e) {
        setStatus(e.message || '保存失败', 'err');
      }
    }

    function scheduleSave() {
      if (!connected) return;
      dirty = true;
      setStatus('未保存', 'saving');
      clearTimeout(timer);
      timer = setTimeout(saveNow, 400);
    }

    document.getElementById('cutBtn').onclick = insertDivider;
    document.getElementById('serverBtn').onclick = () => showOverlay(false);
    document.getElementById('ovCancel').onclick = () => {
      hideOverlay();
      if (!connected) setStatus('未连接', 'err');
    };
    document.getElementById('connForm').onsubmit = async (e) => {
      e.preventDefault();
      ovErr.textContent = '';
      const host = document.getElementById('hostIn').value;
      const port = document.getElementById('portIn').value || DEFAULT_PORT;
      const password = document.getElementById('passIn').value;
      setStatus('连接中…', 'saving');
      try {
        await connectTo(host, port, password);
        hideOverlay();
        await loadNote();
      } catch (err) {
        ovErr.textContent = err.message || '连接失败';
        setStatus(err.message || '无法连接', 'err');
      }
    };
    editor.addEventListener('input', scheduleSave);
    editor.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === '/') {
        e.preventDefault();
        insertDivider();
      }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden && dirty) saveNow(); });
    window.addEventListener('beforeunload', () => { if (dirty) saveNow(); });

    (async function init() {
      try {
        if (await probeSameOrigin()) {
          apiBase = '';
          connected = true;
          const host = location.hostname;
          const port = location.port || (location.protocol === 'https:' ? '443' : '80');
          localStorage.setItem('np_host', host);
          localStorage.setItem('np_port', port);
          await loadNote();
          return;
        }
        if (savedHost()) {
          await connectTo(savedHost(), savedPort(), savedPass());
          await loadNote();
          return;
        }
        setStatus('未连接', 'err');
        showOverlay();
      } catch (e) {
        setStatus(e.message || '无法连接', 'err');
        showOverlay();
      }
    })();
  </script>
</body>
</html>
